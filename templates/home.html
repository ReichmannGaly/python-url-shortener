<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        body {
            background-color: #1a1a1a; /* Dark background for night mode */
            color: #e0e0e0; /* Light text for readability */
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            flex-direction: column;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 1em;
            color: #ffffff; /* White for emphasis */
        }
        .form-container {
            background-color: #2a2a2a; /* Slightly lighter dark for form */
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px; /* Limit form width */
        }
        label {
            display: block;
            margin-bottom: 0.5em;
            font-size: 1.1em;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1em;
            border: none;
            border-radius: 4px;
            background-color: #3a3a3a;
            color: #e0e0e0;
            font-size: 1em;
        }
        button {
            background-color: #4dabf7; /* Bright blue for button */
            color: #ffffff;
            padding: 0.8em 1.5em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #3398db;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>URL Shortener</h1>
        <form method="POST" action="/shorten">
            <label for="url">Enter URL to shorten:</label>
            <input type="text" name="url" id="url" required>
            <button type="submit">Shorten</button>
        </form>
    </div>
</body>
</html>
